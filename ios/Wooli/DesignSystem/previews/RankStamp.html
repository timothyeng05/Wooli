<!doctype html>
<html data-theme="light">
<head><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><meta charset="utf-8"><title>RankStamp — preview</title></head>
<body>
<div class="w-stack" style="gap:24px">
  <div class="w-row" style="gap:28px;padding:8px 6px">
    <div class="w-stamp"><span class="w-stamp__tier">Loved</span><span class="w-stamp__rank">#3</span><span class="w-stamp__place">Brooklyn</span></div>
    <div class="w-stamp w-stamp--fine"><span class="w-stamp__tier">Fine</span><span class="w-stamp__rank">#18</span><span class="w-stamp__place">Lisbon</span></div>
    <div class="w-stamp w-stamp--nope"><span class="w-stamp__tier">Skip</span><span class="w-stamp__rank">#40</span><span class="w-stamp__place">Midtown</span></div>
  </div>
  <div class="w-row" style="gap:16px">
    <div class="w-stamp w-stamp--sm"><span class="w-stamp__rank">3</span></div>
    <div class="w-stamp w-stamp--sm w-stamp--fine"><span class="w-stamp__rank">18</span></div>
    <div class="w-stamp w-stamp--sm w-stamp--nope"><span class="w-stamp__rank">40</span></div>
    <span class="w-want">Want to try</span>
  </div>
</div>
</body>
</html>
