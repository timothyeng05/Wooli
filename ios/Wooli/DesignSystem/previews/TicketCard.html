<!doctype html>
<html data-theme="light">
<head><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="bundle.css"><meta charset="utf-8"><title>TicketCard — preview</title></head>
<body>
<div class="w-stack" style="gap:20px">
  <div class="w-ticket">
    <div class="w-ticket__ends">
      <div class="w-ticket__end"><div class="w-ticket__caption">From</div><div class="w-ticket__code">JFK</div><div class="w-ticket__place">New York</div></div>
      <div class="w-ticket__route"><i></i><span>✈︎</span><i></i></div>
      <div class="w-ticket__end"><div class="w-ticket__caption">To</div><div class="w-ticket__code">LIS</div><div class="w-ticket__place">Lisbon</div></div>
    </div>
    <div class="w-ticket__meta">Fri, Nov 13 · Flight · ~5,420 km</div>
    <div class="w-ticket__panel">
      <div class="w-ticket__row"><span class="w-ticket__route" style="padding:0"><span>✈︎</span></span><span class="w-ticket__row-title">TP 210</span><span class="w-ticket__row-detail">19:40 → 07:25 <span class="w-ticket__flag">+1</span></span></div>
      <div class="w-ticket__row"><span class="w-ticket__route" style="padding:0"><span>▤</span></span><span class="w-ticket__row-title">Airport shuttle</span><span class="w-ticket__row-detail">08:30</span></div>
    </div>
  </div>
  <div class="w-ticket">
    <div class="w-ticket__caption">Net worth</div>
    <div class="w-ticket__amount">$48,215.07</div>
    <div class="w-ticket__meta">↗ $1,200.00 (2.6%) · 1 month</div>
    <div class="w-ticket__panel">
      <div class="w-ticket__row"><span class="w-ticket__row-title">Spent in October</span><span class="w-ticket__row-detail">$1,842.00 of $3,100</span></div>
      <div class="w-ticket__row"><span class="w-ticket__row-title">Left to assign</span><span class="w-ticket__row-detail">$412.00</span></div>
    </div>
  </div>
</div>
</body>
</html>
